[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-workbench"
version = "1.0.0"
description = "Local, open-source workbench to create, version, test, compare and publish prompts and linear prompt chains."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Prompt Workbench contributors" }]
keywords = ["prompts", "llm", "versioning", "evaluation", "litellm", "mongodb"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "jsonschema>=4.22",
    "typer>=0.12",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
# MongoDB is the preferred/primary production backend.
mongo = ["motor>=3.5", "pymongo>=4.8"]
# Real model access (the app runs fully on the mock provider without this).
litellm = ["litellm>=1.44"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mongomock-motor>=0.0.29",
]

[project.scripts]
prompt-workbench = "prompt_workbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_workbench = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
